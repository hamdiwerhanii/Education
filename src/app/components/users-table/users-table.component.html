<div class="site-section">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="widget-next-match">
                    <table class="table custom-table">
                        <thead>
                            <tr class="text-center">
                                <th>Id</th>
                                <th>FN</th>
                                <th>LN</th>
                                <th>Email</th>
                                <th>Tel</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <ng-container *ngFor="let user of users">
                                <ng-container *ngIf="user.role !== 'admin'">
                                    <tr class="text-center">
                                        <td>{{ user._id }}</td>
                                        <td>{{ user.firstName }}</td>
                                        <td>{{ user.lastName }}</td>
                                        <td>{{ user.email }}</td>
                                        <td>{{ user.telephone }}</td>
                                        <td>{{ user.success }}</td>
                                        <td>
                                            <button type="button"
                                                style="background-color: orangered; color: white; font-size: 10px; padding: 5px 10px; border-radius: 6px;"
                                                *ngIf="user.role === 'teacher' && user.success === false"
                                                (click)="validateUser(user._id)">
                                                Validate
                                            </button>

                                            <button type="button"
                                                style="background-color: red; color: white; font-size: 10px; padding: 5px 10px; border-radius: 6px; margin-right: 2px; margin-left: 2px;"
                                                (click)="deleteUser(user._id)">
                                                Delete
                                            </button>

                                            <button type="button"
                                                style="background-color: green; color: white; font-size: 10px; padding: 5px 10px; border-radius: 6px;"
                                                (click)="displayUser(user._id)">
                                                Display
                                            </button>
                                            <span *ngIf="user.role === 'student' && user.requestedCourseIds?.length">
                                                <button type="button"
                                                    style="background-color: dodgerblue; color: white; font-size: 10px; padding: 5px 10px; border-radius: 6px; margin-left: 2px;"
                                                    (click)="acceptStudentRequest(user._id, user.requestedCourseIds[0])"
                                                    *ngIf="!isStudentInCourse(user._id, user.requestedCourseIds[0])">
                                                    Accept
                                                </button>
                                                <span *ngIf="isStudentInCourse(user._id, user.requestedCourseIds[0])"
                                                    class="badge bg-success" style="margin: 2px 0 0 2px;">
                                                    Affected
                                                </span>
                                            </span>

                                        </td>
                                    </tr>
                                </ng-container>
                            </ng-container>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>

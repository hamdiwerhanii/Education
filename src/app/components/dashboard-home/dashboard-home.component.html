<h2 class="main-title">Dashboard</h2>
<div class="row">
    <div class="col-lg-12">
        <div class="users-table table-wrapper">
            <table class="posts-table">
                <thead class="text-center">
                    <tr class="users-table-info">
                        <th>Image</th>
                        <th>Title</th>
                        <!-- <th>Author</th>
                        <th>Status</th> -->
                        <th>Description</th>
                        <th>Duration</th>
                        <th>Students</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody class="text-center">
                    <tr *ngFor="let course of courses">
                        <td>
                            <div class="categories-table-img">
                                <picture>
                                    <source srcset="assets/img/categories/01.webp" type="image/webp"><img
                                        src="assets/img/categories/01.jpg" alt="category">
                                </picture>
                            </div>
                        </td>
                        <td>
                            {{course.name}}
                        </td>
                        <td>{{course.description}}</td>
                        <td>{{course.duration}}</td>
                        <td>
                            <div class="d-flex align-items-center student-avatar-group">
                                <div *ngFor="let student of course.students" class="position-relative me-2">
                                    <img [src]="student.photo" class="student-avatar"
                                        (click)="selectStudent(course._id, student._id)" />
                                </div>
                            </div>
                        </td>
                        <td>
                            <button class="btn btn-success mr-2" (click)="displayCourse(course._id)">Display</button>
                            <button class="btn btn-secondary mr-2" (click)="editCourse(course._id)">Edit</button>
                            <button class="btn btn-primary" (click)="deletCourse(course._id)">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div *ngIf="selectedStudent && selectedCourseId" class="mt-3 p-3 border bg-light rounded">
                <h5 style="font-size: 32px;">Add Grade for Student</h5>
                <form (submit)="submitGrade()">
                    <div class="form-group">
                        <label>Mark</label>
                        <input type="number" class="form-control" [(ngModel)]="grade.mark" name="mark" required />
                    </div>
                    <div class="form-group mt-2">
                        <label>Evaluation</label>
                        <input type="text" class="form-control" [(ngModel)]="grade.evaluation" name="evaluation"
                            required />
                    </div>
                    <button class="btn btn-primary mt-3" type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

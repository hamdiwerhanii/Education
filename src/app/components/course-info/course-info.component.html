<app-banner [title]="'Course Info'"></app-banner>

<section class="about-area3 fix">
    <div class="support-wrapper align-items-center">
        <div class="right-content3">
            <!-- img -->
            <div class="right-img">
                <img src="assets/img/gallery/about3.png" alt="">
            </div>
        </div>
        <div class="left-content3">
            <!-- section tittle -->
            <div class="section-tittle section-tittle2 mb-20">
                <div class="front-text">
                    <h2 class="">{{course.name}}</h2>
                </div>
            </div>
            <div class="single-features">
                <div class="features-icon">
                    <img src="assets/img/icon/right-icon.svg" alt="">
                </div>
                <div class="features-caption">
                    <p>{{course.description}}</p>
                </div>
            </div>
            <div class="single-features">
                <div class="features-icon">
                    <img src="assets/img/icon/right-icon.svg" alt="">
                </div>
                <div class="features-caption">
                    <p>{{course.duration}} Min</p>
                </div>
            </div>
            <div class="d-flex align-items-center  student-avatar-group">
                <img *ngFor="let student of course.students" [src]="student.photo" class="student-avatar" />
            </div>
            <div class="mt-5" *ngIf="currentUser?.role === 'student'">
                <button class="btn" [ngClass]="{
      'btn-success': !alreadyRequested(course._id),
      'btn-secondary': alreadyRequested(course._id)
    }" [disabled]="alreadyRequested(course._id)" (click)="sendRequest(course._id)">
                    {{ alreadyRequested(course._id) ? 'Pending...' : 'Send Request' }}
                </button>
            </div>

        </div>
    </div>
</section>

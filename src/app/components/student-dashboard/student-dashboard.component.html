<app-banner [title]="'Dashboard'"></app-banner>
<ul class="list-group">
    <li *ngFor="let course of courses" class="list-group-item d-flex justify-content-between align-items-center">
        {{ course.name }}
        <button class="btn btn-primary btn-sm" (click)="selectCourse(course)">View Evaluation</button>
    </li>
</ul>

<div *ngIf="selectedCourse" class="mt-4 p-3 border rounded bg-light">
    <h4 style="font-size: 32px;">Course: {{ selectedCourse.name }}</h4>
    <p><strong>Description:</strong> {{ selectedCourse.description }}</p>
    <p><strong>Duration:</strong> {{ selectedCourse.duration }} minutes</p>

    <div *ngIf="myGrade; else noGrade">
        <p><strong>My Mark:</strong> {{ myGrade.mark }}</p>
        <p><strong>Evaluation:</strong> {{ myGrade.evaluation }}</p>
    </div>

    <ng-template #noGrade>
        <p class="text-muted">No grade has been assigned yet.</p>
    </ng-template>
</div>

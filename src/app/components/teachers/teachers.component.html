<app-banner [title]="'Teachers'"></app-banner>
<section class="team-area section-padding40 fix d-flex">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-7 col-lg-8">
                <div class="section-tittle text-center mb-55">
                    <h2>Community experts</h2>
                </div>
            </div>
        </div>
        <form action="" class="searchMatch">
            <input type="text" [(ngModel)]="term" name="search" class="form-control" placeholder="Search for a match">
        </form>
        <div *ngIf="term==''" class="team-active d-flex">
            <app-teacher *ngFor="let teacher of users " [teacher]="teacher"></app-teacher>
        </div>
        <div *ngIf="term!=''" class="team-active d-flex">
            <app-teacher *ngFor="let teacher of users | filter: term " [teacher]="teacher"></app-teacher>
        </div>
    </div>
</section>
